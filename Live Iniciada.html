<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEYALVS • Starting Soon</title>
  <style>
    :root {
      /* CONFIGURAÇÕES RÁPIDAS */
      --canvas-width: 3840;
      --canvas-height: 2160;
      --countdown-minutes: 10;

      --position-x: 50%;
      --position-y: 50%;
      --scale: 1;

      --blue: #1688ff;
      --blue-light: #72c8ff;
      --white: #ffffff;
      --black: #05070b;

      --brand-size: clamp(78px, 5.7vw, 218px);
      --title-size: clamp(96px, 7.2vw, 276px);
      --timer-size: clamp(82px, 5.5vw, 210px);

      --pulse-duration: 5s;
      --intro-duration: 2.4s;
      --shine-duration: 5.5s;
      --smoke-opacity: 0.5;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
    }

    body {
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: transparent;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      left: var(--position-x);
      top: var(--position-y);
      width: min(82vw, 3000px);
      transform: translate(-50%, -50%) scale(var(--scale));
      transform-origin: center;
      text-align: center;
      isolation: isolate;
    }

    .smoke-field {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 118%;
      height: 126%;
      transform: translate(-50%, -50%);
      overflow: visible;
      opacity: var(--smoke-opacity);
      filter: blur(2px);
      z-index: -1;
    }

    .smoke-cloud {
      position: absolute;
      width: 28%;
      aspect-ratio: 2.2 / 1;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 40% 50%, rgba(114,200,255,.30) 0%, rgba(22,136,255,.16) 33%, transparent 72%);
      mix-blend-mode: screen;
      animation: smokeDrift 9s ease-in-out infinite alternate;
      opacity: 0;
    }

    .smoke-cloud:nth-child(1) { left: 6%; top: 30%; animation-delay: -.5s; }
    .smoke-cloud:nth-child(2) { left: 25%; top: 55%; width: 38%; animation-delay: -3s; }
    .smoke-cloud:nth-child(3) { right: 4%; top: 34%; width: 34%; animation-delay: -5.5s; }
    .smoke-cloud:nth-child(4) { right: 20%; top: 64%; width: 26%; animation-delay: -7s; }

    @keyframes smokeDrift {
      0%   { opacity: 0; transform: translate3d(-40px, 35px, 0) scale(.78); filter: blur(22px); }
      28%  { opacity: .65; }
      65%  { opacity: .36; }
      100% { opacity: 0; transform: translate3d(70px, -55px, 0) scale(1.35); filter: blur(38px); }
    }

    .brand {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: .02em;
      margin-bottom: .18em;
      font-size: var(--brand-size);
      line-height: .84;
      letter-spacing: .015em;
      font-style: italic;
      transform: skewX(-7deg);
      filter:
        drop-shadow(0 6px 0 rgba(0,0,0,.95))
        drop-shadow(0 0 14px rgba(22,136,255,.75));
      animation: introSmoke var(--intro-duration) cubic-bezier(.16,.8,.18,1) both,
                 pulseGlow var(--pulse-duration) ease-in-out infinite var(--intro-duration);
    }

    .brand span,
    .title-line,
    .timer {
      -webkit-text-stroke: clamp(3px, .20vw, 8px) var(--black);
      paint-order: stroke fill;
    }


    .brand::after,
    .title::after {
      content: "";
      position: absolute;
      inset: -10% -15%;
      background: linear-gradient(105deg,
        transparent 35%,
        rgba(255,255,255,0) 43%,
        rgba(255,255,255,.95) 50%,
        rgba(114,200,255,.65) 54%,
        transparent 63%);
      transform: translateX(-140%) skewX(-14deg);
      mix-blend-mode: screen;
      opacity: 0;
      animation: shineSweep var(--shine-duration) ease-in-out infinite 2.8s;
      pointer-events: none;
      clip-path: inset(0 0 0 0);
    }

    .title {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .02em;
      line-height: .82;
      margin: 0 auto;
      animation: introSmoke var(--intro-duration) cubic-bezier(.16,.8,.18,1) .18s both,
                 subtleFloat 7s ease-in-out infinite 2.6s;
    }

    .title-line {
      display: block;
      color: var(--white);
      font-size: var(--title-size);
      letter-spacing: .018em;
      font-style: italic;
      text-transform: uppercase;
      transform: skewX(-5deg);
      text-shadow:
        0 10px 0 rgba(0,0,0,.92),
        0 0 15px rgba(255,255,255,.28),
        0 0 28px rgba(22,136,255,.62);
    }

    .title-line.accent {
      color: var(--blue);
      text-shadow:
        0 10px 0 rgba(0,0,0,.92),
        0 0 18px rgba(114,200,255,.58),
        0 0 38px rgba(22,136,255,.82);
    }

    .timer-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: clamp(34px, 2.1vw, 82px);
      padding: .04em .30em .13em;
      animation: introSmoke var(--intro-duration) cubic-bezier(.16,.8,.18,1) .42s both;
    }

    .timer-wrap::before,
    .timer-wrap::after {
      content: "";
      position: absolute;
      top: 50%;
      width: clamp(90px, 8vw, 300px);
      height: clamp(3px, .16vw, 7px);
      background: linear-gradient(90deg, transparent, var(--blue-light), var(--white));
      box-shadow: 0 0 12px var(--blue), 0 0 28px rgba(22,136,255,.7);
      opacity: .9;
    }

    .timer-wrap::before { right: 100%; margin-right: clamp(22px, 1.4vw, 54px); }
    .timer-wrap::after  { left: 100%; margin-left: clamp(22px, 1.4vw, 54px); transform: rotate(180deg); }

    .timer {
      min-width: 5.35ch;
      color: var(--white);
      font-family: Impact, Haettenschweiler, "Arial Black", monospace;
      font-size: var(--timer-size);
      line-height: .95;
      letter-spacing: .035em;
      font-variant-numeric: tabular-nums;
      text-shadow:
        0 7px 0 rgba(0,0,0,.94),
        0 0 12px rgba(255,255,255,.45),
        0 0 30px rgba(22,136,255,.9);
      transition: transform .15s ease, filter .15s ease;
      animation: pulseGlow var(--pulse-duration) ease-in-out infinite 1.2s;
    }

    .timer.tick {
      transform: translateY(-3px) scale(1.018);
      filter: brightness(1.25);
    }

    .particles {
      position: absolute;
      inset: -25%;
      overflow: hidden;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--blue-light);
      box-shadow: 0 0 10px var(--blue), 0 0 20px var(--blue);
      opacity: 0;
      animation: particleFloat var(--dur) linear infinite var(--delay);
    }

    @keyframes particleFloat {
      0%   { opacity: 0; transform: translate3d(0, 90px, 0) scale(.5); }
      18%  { opacity: .85; }
      80%  { opacity: .35; }
      100% { opacity: 0; transform: translate3d(var(--drift), -260px, 0) scale(1.25); }
    }

    @keyframes introSmoke {
      0%   { opacity: 0; transform: translateY(36px) scale(.92) skewX(-7deg); filter: blur(26px) brightness(1.7); }
      45%  { opacity: .55; filter: blur(8px) brightness(1.3); }
      100% { opacity: 1; transform: translateY(0) scale(1) skewX(-7deg); filter: blur(0) brightness(1); }
    }

    @keyframes pulseGlow {
      0%, 100% { filter: brightness(.94) drop-shadow(0 0 10px rgba(22,136,255,.55)); }
      50%      { filter: brightness(1.18) drop-shadow(0 0 24px rgba(22,136,255,.95)); }
    }

    @keyframes shineSweep {
      0%, 62% { opacity: 0; transform: translateX(-140%) skewX(-14deg); }
      68%     { opacity: .95; }
      82%     { opacity: .35; }
      100%    { opacity: 0; transform: translateX(140%) skewX(-14deg); }
    }

    @keyframes subtleFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-7px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Texto de início de live com cronômetro">
    <section class="overlay">
      <div class="particles" id="particles" aria-hidden="true"></div>

      <div class="smoke-field" aria-hidden="true">
        <i class="smoke-cloud"></i>
        <i class="smoke-cloud"></i>
        <i class="smoke-cloud"></i>
        <i class="smoke-cloud"></i>
      </div>

      <div class="title" aria-label="A live já vai começar">
        <span class="title-line">A LIVE JÁ VAI</span>
        <span class="title-line accent">COMEÇAR</span>
      </div>

      <div class="timer-wrap" aria-label="Cronômetro regressivo">
        <div class="timer" id="timer" aria-live="polite">10:00</div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const START_MINUTES = 10; // altere aqui para 5, 15, etc.
      const timer = document.getElementById('timer');
      const particles = document.getElementById('particles');

      let remaining = START_MINUTES * 60;
      let lastWholeSecond = -1;
      const startedAt = performance.now();

      function formatTime(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      function renderTimer(now) {
        const elapsed = Math.floor((now - startedAt) / 1000);
        const current = Math.max(0, remaining - elapsed);

        if (current !== lastWholeSecond) {
          lastWholeSecond = current;
          timer.textContent = formatTime(current);
          timer.classList.remove('tick');
          void timer.offsetWidth;
          timer.classList.add('tick');
          window.setTimeout(() => timer.classList.remove('tick'), 170);
        }

        if (current > 0) {
          requestAnimationFrame(renderTimer);
        } else {
          timer.textContent = '00:00';
        }
      }

      function createParticles() {
        const total = 34;
        for (let i = 0; i < total; i += 1) {
          const particle = document.createElement('i');
          particle.className = 'particle';
          particle.style.left = `${Math.random() * 100}%`;
          particle.style.top = `${58 + Math.random() * 42}%`;
          particle.style.setProperty('--dur', `${5 + Math.random() * 7}s`);
          particle.style.setProperty('--delay', `${-Math.random() * 12}s`);
          particle.style.setProperty('--drift', `${-120 + Math.random() * 240}px`);
          particle.style.transform = `scale(${0.45 + Math.random() * 1.2})`;
          particles.appendChild(particle);
        }
      }

      createParticles();
      requestAnimationFrame(renderTimer);
    })();
  </script>
</body>
</html>
