<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEYALVS Webcam Frame</title>
  <style>
    :root {
      --frame-width: 760px;
      --frame-height: 430px;
      --frame-x: 50%;
      --frame-y: 46%;
      --blue: #1688ff;
      --blue-light: #79c8ff;
      --white: #ffffff;
      --line: 4px;
      --cycle: 12s;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body { font-family: Arial, Helvetica, sans-serif; }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: transparent;
    }

    .webcam-frame {
      position: absolute;
      left: var(--frame-x);
      top: var(--frame-y);
      width: var(--frame-width);
      height: var(--frame-height);
      transform: translate(-50%, -50%);
    }

    .base-frame,
    .light-track {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .base-rect {
      fill: none;
      stroke: var(--blue);
      stroke-width: var(--line);
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 0 3px rgba(22, 136, 255, 0.95))
              drop-shadow(0 0 9px rgba(22, 136, 255, 0.5));
    }

    .inner-rect {
      fill: none;
      stroke: rgba(255,255,255,0.35);
      stroke-width: 1.4px;
      vector-effect: non-scaling-stroke;
    }

    .moving-light {
      fill: none;
      stroke: var(--white);
      stroke-width: 7px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 80 2244;
      animation: travel 7s linear infinite;
      filter: drop-shadow(0 0 4px #ffffff)
              drop-shadow(0 0 10px var(--blue-light))
              drop-shadow(0 0 18px var(--blue));
    }

    .moving-light-trail {
      fill: none;
      stroke: var(--blue-light);
      stroke-width: 11px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 170 2154;
      opacity: 0.42;
      animation: travel 7s linear infinite;
      filter: blur(3px) drop-shadow(0 0 12px var(--blue));
    }

    @keyframes travel {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -2324; }
    }

    .name-wrap {
      position: absolute;
      left: 50%;
      top: calc(100% - 22px);
      width: 100%;
      height: 90px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .name-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .name-text,
    .name-smoke {
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: 54px;
      letter-spacing: 2px;
      font-style: italic;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .name-text {
      fill: var(--white);
      stroke: var(--blue);
      stroke-width: 1.2px;
      paint-order: stroke fill;
      opacity: 0;
      animation: nameCycle var(--cycle) ease-in-out infinite;
      filter: url(#smokeDistort)
              drop-shadow(0 0 4px #ffffff)
              drop-shadow(0 0 10px var(--blue));
    }

    .name-smoke {
      fill: var(--blue-light);
      stroke: var(--white);
      stroke-width: 0.5px;
      opacity: 0;
      animation: smokeTextCycle var(--cycle) ease-in-out infinite;
      filter: url(#smokeDistortStrong) blur(5px);
    }

    @keyframes nameCycle {
      0%, 8%   { opacity: 0; filter: url(#smokeDistortStrong) blur(9px) drop-shadow(0 0 12px var(--blue)); }
      18%      { opacity: 0.65; filter: url(#smokeDistort) blur(3px) drop-shadow(0 0 10px var(--blue)); }
      25%      { opacity: 1; filter: url(#smokeDistort) blur(0) drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 10px var(--blue)); }
      67%      { opacity: 1; filter: url(#smokeDistort) blur(0) drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 10px var(--blue)); }
      79%      { opacity: 0.5; filter: url(#smokeDistortStrong) blur(4px) drop-shadow(0 0 12px var(--blue)); }
      90%,100% { opacity: 0; filter: url(#smokeDistortStrong) blur(10px) drop-shadow(0 0 16px var(--blue)); }
    }

    @keyframes smokeTextCycle {
      0%, 5%   { opacity: 0; transform: translateY(7px) scaleX(0.92); }
      12%      { opacity: 0.65; transform: translateY(2px) scaleX(1); }
      24%      { opacity: 0.22; transform: translateY(-3px) scaleX(1.04); }
      65%      { opacity: 0.05; transform: translateY(-4px) scaleX(1.08); }
      78%      { opacity: 0.65; transform: translateY(-8px) scaleX(1.12); }
      93%,100% { opacity: 0; transform: translateY(-20px) scaleX(1.25); }
    }

    @media (max-width: 1000px), (max-height: 700px) {
      :root {
        --frame-width: 62vw;
        --frame-height: 35vw;
      }
      .name-text,
      .name-smoke { font-size: 46px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="webcam-frame" aria-label="Moldura horizontal de webcam HEYALVS">
      <svg class="base-frame" viewBox="0 0 760 430" preserveAspectRatio="none" aria-hidden="true">
        <rect class="base-rect" x="7" y="7" width="746" height="416" rx="0" ry="0" />
        <rect class="inner-rect" x="14" y="14" width="732" height="402" rx="0" ry="0" />
      </svg>

      <svg class="light-track" viewBox="0 0 760 430" preserveAspectRatio="none" aria-hidden="true">
        <rect class="moving-light-trail" x="7" y="7" width="746" height="416" rx="0" ry="0" pathLength="2324" />
        <rect class="moving-light" x="7" y="7" width="746" height="416" rx="0" ry="0" pathLength="2324" />
      </svg>

      <div class="name-wrap">
        <svg class="name-svg" viewBox="0 0 760 90" aria-hidden="true">
          <defs>
            <filter id="smokeDistort" x="-40%" y="-100%" width="180%" height="300%">
              <feTurbulence type="fractalNoise" baseFrequency="0.018 0.09" numOctaves="2" seed="7" result="noise">
                <animate attributeName="baseFrequency" dur="7s" values="0.018 0.09;0.028 0.12;0.018 0.09" repeatCount="indefinite" />
              </feTurbulence>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="B" />
            </filter>

            <filter id="smokeDistortStrong" x="-60%" y="-160%" width="220%" height="420%">
              <feTurbulence type="fractalNoise" baseFrequency="0.025 0.12" numOctaves="3" seed="11" result="noiseStrong">
                <animate attributeName="baseFrequency" dur="5s" values="0.025 0.12;0.045 0.18;0.025 0.12" repeatCount="indefinite" />
              </feTurbulence>
              <feDisplacementMap in="SourceGraphic" in2="noiseStrong" scale="18" xChannelSelector="R" yChannelSelector="G" />
            </filter>
          </defs>

          <text class="name-smoke" x="380" y="42">HeyALVS</text>
          <text class="name-text" x="380" y="42">HeyALVS</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
